name: Security & Quality Audit

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  schedule:
    - cron: '0 0 * * 1' # Weekly automated security audit

permissions:
  contents: read
  security-events: write

jobs:
  security-scan:
    name: SAST, Dependency SCA & Hygiene Audit
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install Dependencies & Security Scanners
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install bandit bandit-sarif-formatter pyyaml

    - name: Run Secret & Privacy Leak Scanner
      run: |
        python tools/secret_scanner.py

    - name: Run Dependency Vulnerability Audit (Google OSV / PyPA)
      run: |
        python tools/dependency_audit.py

    - name: Run Bandit AST Security Scan (SARIF Report)
      run: |
        bandit -r main.py scripts/ tools/ -ll -f sarif -o bandit-results.sarif
        bandit -r main.py scripts/ tools/ -ll

    - name: Upload Bandit SARIF to GitHub Security Tab
      uses: github/codeql-action/upload-sarif@v3
      continue-on-error: true
      if: always()
      with:
        sarif_file: bandit-results.sarif
        category: bandit-sast

    - name: Run Security Posture Unit Tests
      run: |
        python -m unittest discover tests -p "test_security_posture.py"

    - name: Run Complete Quantitative & Invariant Test Suite
      run: |
        python -m unittest discover tests
